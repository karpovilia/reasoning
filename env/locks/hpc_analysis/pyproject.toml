[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []  # стандартное расположение src/ — без packaging пакетов; код запускается напрямую

[project]
name = "reasoning"
version = "0.1.0"
description = "EventBudget: Hawkes-process framework for budget-aware reasoning (data preparation pipeline)"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
  # core inference
  "torch>=2.4",
  "transformers>=4.46",
  "accelerate>=1.0",
  "tokenizers>=0.20",
  "sentencepiece>=0.2",
  "safetensors>=0.4",
  "huggingface_hub>=0.26",
  "datasets>=3.0",

  # numerics / data — пины ради manylinux-wheels на nexus.charisma
  # (без верхней границы pandas pip ловит pandas 3.0.x → только sdist → GCC 4.8 не тянет)
  "numpy>=1.26,<2.3",
  "pandas>=2.2,<2.3",
  "scipy>=1.13,<1.15",
  "scikit-learn>=1.5,<1.7",
  "pyarrow>=17.0,<19",

  # config / cli / io
  "pyyaml>=6.0",
  "pydantic>=2.8",
  "typer>=0.12",
  "tqdm>=4.66",
  "rich>=13.7",
  "orjson>=3.10",

  # plotting / analysis
  "matplotlib>=3.9",
  "seaborn>=0.13",

  # math answer normalization / grading
  "sympy>=1.13",
  "math-verify>=0.5.2",

  # conformal prediction
  "mapie>=0.9",

  # logging / experiment tracking (optional but cheap)
  "wandb>=0.18",
]

[project.optional-dependencies]
vllm = ["vllm>=0.6.3"]
dev = ["ruff>=0.6", "pytest>=8.3", "ipython>=8.27", "jupyterlab>=4.2"]

[tool.uv]
# Pin a single Python so HPC + local stay in sync
python-preference = "managed"

[tool.ruff]
line-length = 110
target-version = "py311"
