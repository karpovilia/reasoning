[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-control"
version = "2.0.0"
description = "Event-span detection and action selection for language-model reasoning"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4", "scipy==1.14.1", "scikit-learn==1.6.1", "torch>=2.8,<3"]

[project.optional-dependencies]
neural = ["transformers==4.56.2", "peft==0.17.1", "accelerate>=1,<2", "safetensors>=0.6,<1", "matplotlib>=3.9,<4"]
retrieval = ["httpx>=0.28,<1", "requests>=2.32,<3", "tqdm>=4.66,<5"]
data = ["zstandard>=0.23,<1", "jsonschema>=4.23,<5"]
test = ["pytest>=8,<10", "httpx==0.28.1"]
tokenization = ["tokenizers==0.22.2"]

[project.scripts]
reasoning-detector = "reasoning_control.detector:main"
reasoning-gate = "reasoning_control.gate:main"
reasoning-data = "reasoning_control.data:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json"]
